<text x="85" y="932" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" fill="#192b3d">外部电位器：J3.1 → 电阻轨一端；J3.2 → 滑动端；J3.3 → 电阻轨另一端。实物端子用万用表确认。</text>
<text x="85" y="966" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" fill="#192b3d">4.7k 与标称 10k 形成约 2.24V 供电；ADC 选择高衰减，按机械实际行程校准。100nF 靠近主控插座。</text>
<text x="85" y="996" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#637180">C1/C2 位于显示电源入口，C3/C4 位于载板 3V3 入口；储能与 USB 浪涌要在整机供电定稿时复核。</text>
