[platformio]
default_envs = s3_uart

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
lib_deps =

[env:s3_uart]
; CH343 port (currently COM4): Serial is UART0, not native USB CDC.
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=0

[env:s3_native_usb]
; Alternative for the board's native USB connector.
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:s3_matrix_scroll]
extends = env:s3_uart
build_src_filter = +<matrix_scroll.cpp>
lib_deps =

[env:s3_oled_legacy]
extends = env:s3_uart
build_src_filter = +<main_oled.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
