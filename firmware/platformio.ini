[platformio]
default_envs = c3_as5600_controller

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
lib_deps =

[env:s3_uart]
; CH343 port (currently COM4): Serial is UART0, not native USB CDC.
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=0

[env:s3_native_usb]
; Alternative for the board's native USB connector.
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:s3_matrix_scroll]
extends = env:s3_uart
build_src_filter = +<matrix_scroll.cpp>
lib_deps =

[env:s3_as5600_test]
extends = env:s3_uart
build_src_filter = +<as5600_test.cpp>
lib_deps =

[env:s3_as5600_controller]
extends = env:s3_uart
build_flags = ${env:s3_uart.build_flags} -D JR_USE_AS5600=1

[env:c3_as5600_controller]
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
custom_firmware_series = hidari1
custom_firmware_model = JR-C3-AS5600-R1
custom_firmware_version = 1.1.0
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D JR_USE_AS5600=1 -D JR_FIRMWARE_VERSION=${this.custom_firmware_version}

[env:c3_hidari_2]
extends = env:c3_as5600_controller
custom_firmware_series = hidari2
custom_firmware_model = JR-C3-HIDARI-2
custom_firmware_version = 1.1.0
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D JR_USE_AS5600=1 -D JR_HIDARI_2=1 -D JR_FIRMWARE_VERSION=${this.custom_firmware_version}

[env:s3_oled_legacy]
extends = env:s3_uart
build_src_filter = +<main_oled.cpp>

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
